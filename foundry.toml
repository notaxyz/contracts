[profile.default]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/"
]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [{ access = "read", path = "./README.md" }]

solc_version = "0.8.24"
evm_version = "cancun"
offline = true
optimizer = true
optimizer_runs = 200

[profile.ci]
offline = false
