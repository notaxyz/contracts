[profile.default]
remappings = [
  "@openzeppelin/=lib/openzeppelin-contracts/"
]
src = "src"
out = "out"
libs = ["lib"]
fs_permissions = [
  { access = "read", path = "./README.md" },
  { access = "read", path = "./script/demo-listing.json" },
  { access = "read-write", path = "./script/demo-metadata.json" },
]

solc_version = "0.8.24"
evm_version = "cancun"
offline = true
optimizer = true
optimizer_runs = 200

[profile.ci]
offline = false
